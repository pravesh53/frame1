<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Categories — Responsive UI</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #2563eb;
      --radius: 14px;
      --gap: 16px;
      --shadow: 0 6px 18px rgba(16, 24, 40, 0.06);
    }

    * {
      box-sizing: border-box
    }

    body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      margin: 0;
      background: var(--bg);
      color: #0f172a
    }

    .wrap {
      max-width: 1100px;
      margin: 32px auto;
      padding: 20px
    }

    header.top {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px
    }

    .title {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .title h1 {
      font-size: 18px;
      margin: 0
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted)
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .search {
      background: var(--card);
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 8px;
      align-items: center
    }

    .search input {
      border: 0;
      outline: none;
      width: 180px;
      font-size: 14px;
      background: transparent
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow);
      border: 1px solid rgba(15, 23, 42, 0.04)
    }

    .chip[aria-pressed="true"] {
      background: linear-gradient(90deg, var(--accent) 0%, #60a5fa 100%);
      color: #fff;
      border: 0
    }

    /* grid */
    .grid {
      display: grid;
      gap: var(--gap);
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      align-items: start
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease;
      border: 1px solid rgba(15, 23, 42, 0.03)
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.09)
    }

    .visual {
      width: 88px;
      height: 88px;
      border-radius: 999px;
      margin: 0 auto 12px;
      overflow: hidden;
      display: grid;
      place-items: center
    }

    .visual svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .name {
      font-weight: 600;
      font-size: 15px;
      margin: 6px 0
    }

    .meta {
      font-size: 13px;
      color: var(--muted)
    }

    /* responsive tweaks */
    @media (max-width:420px) {
      .search input {
        width: 110px
      }

      .wrap {
        padding: 12px
      }
    }

    /* simple skeleton state for loading cards (optional) */
    .skeleton {
      animation: pulse 1.2s linear infinite;
      background: linear-gradient(90deg, #f3f4f6 25%, #e9eefc 37%, #f3f4f6 63%);
      background-size: 400% 100%
    }

    @keyframes pulse {
      to {
        background-position: 100% 0
      }
    }

    /* hide helper text when filtering */
    .no-results {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: var(--muted)
    }

    .no-results.show {
      display: block
    }
  </style>
</head>

<body>
  <!--
    Single-file responsive Product Category UI.
    - Open this file in a browser to preview.
    - Click chips to filter categories, use search to filter names.
    - If you want a React/Tailwind or Bootstrap version, tell me and I'll convert it.
  -->

  <div class="wrap">
    <header class="top">
      <div class="title">
        <div>
          <h1>Product categories</h1>
          <div class="subtitle">Browse by category — responsive grid</div>
        </div>
      </div>

      <div class="controls">
        <div class="search" role="search" aria-label="Search products">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden>
            <path d="M21 21l-4.35-4.35" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"></path>
            <circle cx="11" cy="11" r="6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"></circle>
          </svg>
          <input id="search" placeholder="Search product..." />
        </div>
      </div>
    </header>

    <div class="chips" role="tablist" aria-label="Filter categories">
      <button class="chip" data-cat="all" aria-pressed="true">All</button>
      <button class="chip" data-cat="camera" aria-pressed="false">Cameras</button>
      <button class="chip" data-cat="accessory" aria-pressed="false">Accessories</button>
      <button class="chip" data-cat="lenses" aria-pressed="false">Lenses</button>
      <button class="chip" data-cat="tripods" aria-pressed="false">Tripods</button>
    </div>

    <main style="margin-top:18px">
      <div id="grid" class="grid" aria-live="polite">

        <!-- Example cards -->
        <article class="card" data-category="camera" data-name="Mirrorless Camera">
          <div class="visual">
            <!-- placeholder circle graphic -->
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img"
              aria-label="Mirrorless camera image">
              <defs>
                <linearGradient id="g1" x1="0" x2="1">
                  <stop offset="0" stop-color="#60a5fa" />
                  <stop offset="1" stop-color="#2563eb" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g1)"></rect>
              <text x="50" y="55" font-size="24" font-family="sans-serif" text-anchor="middle" fill="white">CM</text>
            </svg>
          </div>
          <div class="name">Mirrorless Camera</div>
          <div class="meta">From ₹45,999</div>
        </article>

        <article class="card" data-category="lenses" data-name="50mm Prime Lens">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g2" x1="0" x2="1">
                  <stop offset="0" stop-color="#34d399" />
                  <stop offset="1" stop-color="#059669" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g2)"></rect>
              <text x="50" y="55" font-size="24" font-family="sans-serif" text-anchor="middle" fill="white">50</text>
            </svg>
          </div>
          <div class="name">50mm Prime Lens</div>
          <div class="meta">From ₹9,499</div>
        </article>

        <article class="card" data-category="accessory" data-name="Camera Bag">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g3" x1="0" x2="1">
                  <stop offset="0" stop-color="#f59e0b" />
                  <stop offset="1" stop-color="#f97316" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g3)"></rect>
              <text x="50" y="55" font-size="20" font-family="sans-serif" text-anchor="middle" fill="white">BG</text>
            </svg>
          </div>
          <div class="name">Camera Bag</div>
          <div class="meta">From ₹1,299</div>
        </article>

        <article class="card" data-category="tripods" data-name="Carbon Tripod">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g4" x1="0" x2="1">
                  <stop offset="0" stop-color="#a78bfa" />
                  <stop offset="1" stop-color="#7c3aed" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g4)"></rect>
              <text x="50" y="55" font-size="18" font-family="sans-serif" text-anchor="middle" fill="white">TP</text>
            </svg>
          </div>
          <div class="name">Carbon Tripod</div>
          <div class="meta">From ₹6,299</div>
        </article>

        <article class="card" data-category="camera" data-name="Action Camera">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g5" x1="0" x2="1">
                  <stop offset="0" stop-color="#fb7185" />
                  <stop offset="1" stop-color="#ef4444" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g5)"></rect>
              <text x="50" y="55" font-size="18" font-family="sans-serif" text-anchor="middle" fill="white">AC</text>
            </svg>
          </div>
          <div class="name">Action Camera</div>
          <div class="meta">From ₹19,999</div>
        </article>

        <article class="card" data-category="accessory" data-name="Memory Card">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g6" x1="0" x2="1">
                  <stop offset="0" stop-color="#60a5fa" />
                  <stop offset="1" stop-color="#3b82f6" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g6)"></rect>
              <text x="50" y="55" font-size="18" font-family="sans-serif" text-anchor="middle" fill="white">SD</text>
            </svg>
          </div>
          <div class="name">Memory Card</div>
          <div class="meta">From ₹599</div>
        </article>

        <article class="card" data-category="lenses" data-name="Zoom Lens 70-200">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g7" x1="0" x2="1">
                  <stop offset="0" stop-color="#fb923c" />
                  <stop offset="1" stop-color="#f97316" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g7)"></rect>
              <text x="50" y="55" font-size="18" font-family="sans-serif" text-anchor="middle" fill="white">ZL</text>
            </svg>
          </div>
          <div class="name">Zoom Lens 70-200</div>
          <div class="meta">From ₹49,999</div>
        </article>

        <article class="card" data-category="tripods" data-name="Budget Tripod">
          <div class="visual">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g8" x1="0" x2="1">
                  <stop offset="0" stop-color="#f472b6" />
                  <stop offset="1" stop-color="#ec4899" />
                </linearGradient>
              </defs>
              <rect width="100" height="100" rx="50" fill="url(#g8)"></rect>
              <text x="50" y="55" font-size="18" font-family="sans-serif" text-anchor="middle" fill="white">BT</text>
            </svg>
          </div>
          <div class="name">Budget Tripod</div>
          <div class="meta">From ₹899</div>
        </article>

      </div>

      <div id="no" class="no-results">No products match your search.</div>
    </main>
  </div>

  <script>
    // Minimal filtering logic: chips + search
    const chips = document.querySelectorAll('.chip');
    const cards = Array.from(document.querySelectorAll('.card'));
    const search = document.getElementById('search');
    const noResults = document.getElementById('no');

    function applyFilter() {
      const active = document.querySelector('.chip[aria-pressed="true"]');
      const cat = active ? active.dataset.cat : 'all';
      const q = search.value.trim().toLowerCase();

      let visible = 0;
      cards.forEach(card => {
        const name = card.dataset.name.toLowerCase();
        const matchesCat = (cat === 'all') || (card.dataset.category === cat);
        const matchesQuery = q === '' || name.includes(q);
        if (matchesCat && matchesQuery) {
          card.style.display = '';
          visible++;
        } else {
          card.style.display = 'none';
        }
      });
      noResults.classList.toggle('show', visible === 0);
    }

    chips.forEach(c => {
      c.addEventListener('click', () => {
        chips.forEach(x => x.setAttribute('aria-pressed', 'false'));
        c.setAttribute('aria-pressed', 'true');
        applyFilter();
      });
    });

    search.addEventListener('input', applyFilter);

    // keyboard accessibility: allow Enter/Space on chips
    chips.forEach(c => {
      c.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); }
      });
    });
  </script>
</body>

</html>
